      hot-floor: '%tongue_combatlogx:expansion.damage-tagger.damage-type.hot-floor%'
      lava: '%tongue_combatlogx:expansion.damage-tagger.damage-type.lava%'
      lightning: '%tongue_combatlogx:expansion.damage-tagger.damage-type.lightning%'
      magic: '%tongue_combatlogx:expansion.damage-tagger.damage-type.magic%'
      melting: '%tongue_combatlogx:expansion.damage-tagger.damage-type.melting%'
      poison: '%tongue_combatlogx:expansion.damage-tagger.damage-type.poison%'
      starvation: '%tongue_combatlogx:expansion.damage-tagger.damage-type.starvation%'
      suffocation: '%tongue_combatlogx:expansion.damage-tagger.damage-type.suffocation%'
      void: '%tongue_combatlogx:expansion.damage-tagger.damage-type.void%'
      wither: '%tongue_combatlogx:expansion.damage-tagger.damage-type.wither%'
