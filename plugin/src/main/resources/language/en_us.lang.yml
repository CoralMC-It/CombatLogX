language-name: en_us
decimal-format: '0.00'
prefix: '%tongue_combatlogx:prefix%'
broadcast:
  on-load: <green><bold>CombatLogX was loaded successfully.</bold></green>
  on-enable: <green><bold>CombatLogX was enabled successfully.</bold></green>
  on-disable: <red><bold>CombatLogX was disabled successfully.</bold></red>
placeholder:
  time-left-zero: '%tongue_combatlogx:placeholder.time-left-zero%'
  unknown-enemy: '%tongue_combatlogx:placeholder.unknown-enemy%'
  status:
    fighting: '%tongue_combatlogx:placeholder.status.fighting%'
    in-combat: '%tongue_combatlogx:placeholder.status.in-combat%'
    idle: '%tongue_combatlogx:placeholder.status.idle%'
    not-in-combat: '%tongue_combatlogx:placeholder.status.not-in-combat%'
  toggle:
    enabled: '%tongue_combatlogx:placeholder.toggle.enabled%'
    disabled: '%tongue_combatlogx:placeholder.toggle.disabled%'
  pvp-status:
    enabled: '%tongue_combatlogx:placeholder.pvp-status.enabled%'
    disabled: '%tongue_combatlogx:placeholder.pvp-status.disabled%'
combat-timer:
  expire: '%tongue_combatlogx:combat-timer.expire%'
  enemy-death: '%tongue_combatlogx:combat-timer.enemy-death%'
  self-death: '%tongue_combatlogx:combat-timer.self-death%'
error:
  player-only: '%tongue_combatlogx:error.player-only%'
  console-only: '%tongue_combatlogx:error.console-only%'
  invalid-target: '%tongue_combatlogx:error.invalid-target%'
  invalid-integer: '%tongue_combatlogx:error.invalid-integer%'
  no-permission: '%tongue_combatlogx:error.no-permission%'
  disabled-world: '%tongue_combatlogx:error.disabled-world%'
  target-not-in-combat: '%tongue_combatlogx:error.target-not-in-combat%'
  self-not-in-combat: '%tongue_combatlogx:error.self-not-in-combat%'
  unknown-expansion: '%tongue_combatlogx:error.unknown-expansion%'
  forgive-not-enemy: '%tongue_combatlogx:error.forgive-not-enemy%'
  enemy-not-forgiving: '%tongue_combatlogx:error.enemy-not-forgiving%'
command:
  combatlogx:
    help-message-list:
    - ''
    - <gold><bold>CombatLogX Command Help:</bold></gold>
    - '  <white><bold>/combatlogx help</bold></white><gray>: View this help page.</gray>'
    - '  <white><bold>/combatlogx reload</bold></white><gray>: Reload the config.yml, language.yml, and all expansion config files.</gray>'
    - '  <white><bold>/combatlogx about \<expansion></bold></white><gray>: Check information about an expansion.</gray>'
    - '  <white><bold>/combatlogx tag \<player> [seconds]</bold></white><gray>: Force a player into combat.</gray>'
    - '  <white><bold>/combatlogx toggle bossbar/actionbar/scoreboard</bold></white><gray>: Enable or disable a notification type.</gray>'
    - '  <white><bold>/combatlogx untag \<player></bold></white><gray>: Force a player out of combat.</gray>'
    - '  <white><bold>/combatlogx version</bold></white><gray>: Check your version of CombatLogX.</gray>'
    - '  <white><bold>/combatlogx forgive request \<player></bold></white><gray>: Send a request to an enemy to remove their tag from you.</gray>'
    - '  <white><bold>/combatlogx forgive accept \<player></bold></white><gray>: Allow an enemy''s request to escape from combat.</gray>'
    - '  <white><bold>/combatlogx forgive reject \<player></bold></white><gray>: Ignore an enemy''s request to escape from combat.</gray>'
    - '  <white><bold>/combatlogx forgive toggle</bold></white><gray>: Enable or disable requests for stopping combat.</gray>'
    - ''
    reload-success:
    - <green>Successfully reloaded all configuration files from CombatLogX.</green>
    - <green>Successfully reloaded all language files from CombatLogX.</green>
    - <green>Successfully reloaded all configuration files from CombatLogX expansions.</green>
    reload-failure:
    - <red>An error occurred while reloading the configuration.</red>
    - <red>Please check your server log and fix the broken file.</red>
    tag-player: <green>Successfully forced player <gray>{target}</gray> into combat.</green>
    tag-failure: <red><gray>{target}</gray> could not be placed into combat. (Maybe they have a bypass?)</red>
    untag-player: <green>Successfully forced player <gray>{target}</gray> out of combat.</green>
    toggle-bossbar: '%tongue_combatlogx:command.combatlogx.toggle-bossbar%'
    toggle-actionbar: '%tongue_combatlogx:command.combatlogx.toggle-actionbar%'
    toggle-scoreboard: '%tongue_combatlogx:command.combatlogx.toggle-scoreboard%'
    expansion-information:
    - ''
    - <white><bold>Expansion Information for</bold> <green>{name}</green><bold>:</bold></white>
    - <white><bold>Display Name:</bold></white> <gray>{prefix}</gray>
    - <white><bold>Version:</bold></white> <gray>{version}</gray>
    - <white><bold>State:</bold></white> <gray>{state}</gray>
    - ''
    - <white><bold>Description:</bold></white> <gray>{description}</gray>
    - <white><bold>Website:</bold></white> <gray>{website}</gray>
    - <white><bold>Authors:</bold></white> <gray>{authors}</gray>
    forgive:
      toggle-disable: '%tongue_combatlogx:command.combatlogx.forgive.toggle-disable%'
      toggle-enable: '%tongue_combatlogx:command.combatlogx.forgive.toggle-enable%'
      request-sent: '%tongue_combatlogx:command.combatlogx.forgive.request-sent%'
      request-receive: '%tongue_combatlogx:command.combatlogx.forgive.request-receive%'
      no-active-request: '%tongue_combatlogx:command.combatlogx.forgive.no-active-request%'
      accept-player: '%tongue_combatlogx:command.combatlogx.forgive.accept-player%'
      accept-enemy: '%tongue_combatlogx:command.combatlogx.forgive.accept-enemy%'
      reject-player: '%tongue_combatlogx:command.combatlogx.forgive.reject-player%'
      reject-enemy: '%tongue_combatlogx:command.combatlogx.forgive.reject-enemy%'
  combat-timer:
    time-left-self: '%tongue_combatlogx:command.combat-timer.time-left-self%'
    time-left-other: '%tongue_combatlogx:command.combat-timer.time-left-other%'
tagged:
  unknown:
    player: '%tongue_combatlogx:tagged.unknown.player%'
    mob: '%tongue_combatlogx:tagged.unknown.mob%'
    mythic_mob: '%tongue_combatlogx:tagged.unknown.mythic_mob%'
    damage: '%tongue_combatlogx:tagged.unknown.damage%'
    unknown: '%tongue_combatlogx:tagged.unknown.unknown%'
  attacked:
    player: '%tongue_combatlogx:tagged.attacked.player%'
    mob: '%tongue_combatlogx:tagged.attacked.mob%'
    mythic_mob: '%tongue_combatlogx:tagged.attacked.mythic_mob%'
    damage: '%tongue_combatlogx:tagged.attacked.damage%'
    unknown: '%tongue_combatlogx:tagged.attacked.unknown%'
  attacker:
    player: '%tongue_combatlogx:tagged.attacker.player%'
    mob: '%tongue_combatlogx:tagged.attacker.mob%'
    mythic_mob: '%tongue_combatlogx:tagged.attacker.mythic_mob%'
    damage: '%tongue_combatlogx:tagged.attacker.damage%'
    unknown: '%tongue_combatlogx:tagged.attacker.unknown%'
expansion:
  angel-chest:
    prevent-opening: '%tongue_combatlogx:expansion.angel-chest.prevent-opening%'
    prevent-breaking: '%tongue_combatlogx:expansion.angel-chest.prevent-breaking%'
    prevent-fast-looting: '%tongue_combatlogx:expansion.angel-chest.prevent-fast-looting%'
  action-bar:
    timer: '%tongue_combatlogx:expansion.action-bar.timer%'
    ended: '%tongue_combatlogx:expansion.action-bar.ended%'
  boss-bar:
    timer: '%tongue_combatlogx:expansion.boss-bar.timer%'
    ended: '%tongue_combatlogx:expansion.boss-bar.ended%'
  scoreboard:
    title: '%tongue_combatlogx:expansion.scoreboard.title%'
    lines: '%tongue_combatlogx:expansion.scoreboard.lines%'
  cheat-prevention:
    command-blocked: '%tongue_combatlogx:expansion.cheat-prevention.command-blocked%'
    no-riptide: '%tongue_combatlogx:expansion.cheat-prevention.no-riptide%'
    no-totem: '%tongue_combatlogx:expansion.cheat-prevention.no-totem%'
    no-entity-interaction: '%tongue_combatlogx:expansion.cheat-prevention.no-entity-interaction%'
