      drowning: '%tongue_combatlogx:expansion.damage-tagger.damage-type.drowning%'
      dryout: '%tongue_combatlogx:expansion.damage-tagger.damage-type.dryout%'
      entity-explosion: '%tongue_combatlogx:expansion.damage-tagger.damage-type.entity-explosion%'
      fall: '%tongue_combatlogx:expansion.damage-tagger.damage-type.fall%'
      falling-block: '%tongue_combatlogx:expansion.damage-tagger.damage-type.falling-block%'
